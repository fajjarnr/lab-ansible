---
- name: Create ansible user
  hosts: all
  become: true
  tasks:
    - name: Ping all Servers
      ansible.builtin.ping:
    - name: Add users
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /bin/bash
        groups: adm
        append: true
        create_home: true
      loop:
        - devops
        - ansible
    - name: Add ssh public key
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ lookup('file', '/home/runner/.ssh/id_ed25519.pub') }}"
      loop:
        - devops
        - ansible
